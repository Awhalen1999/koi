# No themes: the chrome borrows the wallpaper, and a theme over vibrancy
# half-applies. As in Zen, an installed theme is ignored
# (LightweightThemeConsumer-sys-mjs.patch), and about:addons' Themes category
# and Settings' "Manage themes" link are hidden. False restores Firefox's
# behaviour.
- name: koi.theme.disable-lightweight
  value: true
