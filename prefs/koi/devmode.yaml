# Developer mode (src/koi/devmode/), switched on from ☰ ▸ Developer Mode.
- name: koi.devmode.enabled
  value: false

# The page's error count on the Developer Tools button. Its own switch (⚒
# menu), so it can go quiet without leaving dev mode.
- name: koi.devmode.error-badge
  value: true
