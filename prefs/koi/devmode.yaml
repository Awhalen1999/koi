# Developer mode (src/koi/devmode/). Off until switched on from the ☰ menu:
# nothing in it is for a first launch.
- name: koi.devmode.enabled
  value: false

# The page's error count on the Console button, its own switch in the
# developer menu so it can go quiet without leaving dev mode.
- name: koi.devmode.error-badge
  value: true
