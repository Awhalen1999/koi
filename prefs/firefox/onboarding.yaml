# Nothing pops up on first launch. Branding already empties the welcome and
# what's-new URLs; these turn off the machinery that would open them.

- name: browser.aboutwelcome.enabled
  value: false

- name: browser.shell.checkDefaultBrowser
  value: false

# BrowserContentHandler's post-update what's-new page; "ignore" disables it.
- name: browser.startup.homepage_override.mstone
  value: "ignore"

# Suppresses the first-run rights notification.
- name: browser.rights.3.shown
  value: true

# ASRouter's add-on and feature recommendations. ASRouter starts every launch
# (BrowserGlue) whatever the new tab page does, so these are off at their own
# prefs, as in Zen.
- name: browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons
  value: false

- name: browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features
  value: false

# UITour lets mozilla.org pages open and highlight parts of the chrome.
- name: browser.uitour.enabled
  value: false

# Mozilla's Terms of Use modal is skipped only when MOZILLA_OFFICIAL is unset
# (firefox.js). Release builds set it ($KOI_RELEASE), so this keeps the modal
# away there too, as in Zen.
- name: termsofuse.bypassNotification
  value: true
