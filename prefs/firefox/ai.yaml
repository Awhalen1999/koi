# Firefox's AI features, on by default in 157: the chatbot (context menu,
# selection shortcuts, sidebar), link previews, the local ML engine and
# Settings' AI controls. Zen's prefs/firefox/ai.yaml, taken whole.

- name: browser.ml.chat.enabled
  value: false

- name: browser.ml.chat.menu
  value: false

- name: browser.ml.chat.shortcuts
  value: false

- name: browser.ml.chat.shortcuts.custom
  value: false

- name: browser.ml.chat.sidebar
  value: false

- name: browser.ml.linkPreview.enabled
  value: false

- name: browser.ml.enable
  value: false

- name: browser.preferences.aiControls
  value: false
