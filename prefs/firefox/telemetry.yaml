# A backstop: telemetry, health report, Normandy and the crash reporter are
# compiled out (configs/common/mozconfig, the moz.configure patches), so
# these only guard against a build-flag regression. Prefs whose only readers
# are compiled out cannot be listed (prefs/README.md).

- name: toolkit.telemetry.unified
  value: false

# The telemetry JS still ships (only reporting is compiled out), so recording
# is off too. This does not silence the TelemetryUtils startup error
# (CLAUDE.md).
- name: toolkit.telemetry.enabled
  value: false

- name: toolkit.telemetry.archive.enabled
  value: false

- name: datareporting.policy.dataSubmissionEnabled
  value: false

- name: datareporting.healthreport.uploadEnabled
  value: false

# Shield / Normandy studies.
- name: app.shield.optoutstudies.enabled
  value: false

# Sends interest data to Mozilla for add-on recommendations.
- name: browser.discovery.enabled
  value: false
