# Agent Connect (src/koi/agents/). Lets Firefox start its remote-control
# servers at runtime instead of only from launch flags; Firefox shows no way
# to do it outside Nightly, so nothing starts until Allow agents is on.
- name: remote.experimental.dynamicstart.enabled
  value: true

# Firefox's bars while the servers run and while an application is connected
# (RemoteControlBanner.sys.mjs). Koi shows the agent in the address field and
# its status in the agents panel.
- name: remote.experimental.dynamicstart.banner.enabled
  value: false

- name: remote.experimental.dynamicstart.connectionbanner.enabled
  value: false
