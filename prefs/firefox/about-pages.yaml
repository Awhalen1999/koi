# Upsells on Firefox's about: pages, most fetching from Mozilla services.
# Each pref's reader is noted.

# The Mozilla VPN promo, on about:privatebrowsing and as the VPN card on
# about:protections (protections/content/vpn-card.mjs).
- name: browser.vpn_promo.enabled
  value: false

# about:addons' Recommendations pane, which fetches from AMO
# (mozapps/extensions/content/aboutaddons-utils.mjs).
- name: extensions.getAddons.showPane
  value: false

# Nova's theme picker in about:addons (aboutaddons-themes-picker.mjs), in
# case the themes view is reached by URL; themes are off (koi/theme.yaml).
- name: browser.aboutaddons.novaThemesPickerEnabled
  value: false

# The recommendation rows AMO injects into the add-on lists
# (mozapps/extensions/content/aboutaddons.mjs).
- name: extensions.htmlaboutaddons.recommendations.enabled
  value: false

# about:protections' mobile card, which brandShortName turns into "Koi
# Browser for Android and iOS" (no such product) over links to Firefox's
# listings (protections/content/protections.mjs).
- name: browser.contentblocking.report.show_mobile_app
  value: false
