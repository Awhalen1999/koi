# Sponsored suggestions in the address bar.
- name: browser.urlbar.suggest.quicksuggest.sponsored
  value: false

# Mozilla product upsell pane in Settings.
- name: browser.preferences.moreFromMozilla
  value: false

# MOZ_APPUPDATE_HOST is surfer's deliberately non-resolving placeholder until
# Koi has a real update server. Auto-update must stay off until it does.
- name: app.update.auto
  value: false

# The old-build check reads app.update.checkInstallTime.days, a branding pref
# surfer's generated branding never defines. The read throws inside
# BrowserGlue._onFirstWindowLoaded and silently aborts everything after it —
# the whole browser-first-window-ready category (PageActions, AboutNewTab,
# TabCrashHandler, ProcessHangMonitor, ...). No update server, no install-time
# check; skipping it also unbreaks the star/⌘D popup and about:newtab.
- name: app.update.checkInstallTime
  value: false

# Matches --with-unsigned-addon-scopes=app,system; Mozilla's signing does not
# cover this build.
- name: xpinstall.signatures.required
  value: false
