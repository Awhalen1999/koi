# The new tab page belongs to the page, not to us. Strip Mozilla's activity
# stream entirely rather than configuring it down.

- name: browser.newtabpage.enabled
  value: false

- name: browser.newtabpage.activity-stream.feeds.topsites
  value: false

- name: browser.newtabpage.activity-stream.feeds.section.topstories
  value: false

- name: browser.newtabpage.activity-stream.showSponsoredTopSites
  value: false

- name: browser.newtabpage.activity-stream.telemetry
  value: false

# Mozilla's sponsored tile service.
- name: browser.topsites.contile.enabled
  value: false
