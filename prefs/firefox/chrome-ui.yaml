# Chrome and empty-state settings Firefox exposes only as prefs.

# The chrome is two rows; the bookmarks row is opt-in (View ▸ Toolbars).
- name: browser.toolbars.bookmarks.visibility
  value: never

# Tabs narrow together to 100px, then the strip scrolls.
- name: browser.tabs.tabMinWidth
  value: 100

# Startup opens the same page as +, about:newtab (blank with the newtab page
# off), which shows the empty state (src/koi/newtab/) and takes Firefox's
# default favicon, Koi's mark; about:blank would show no icon.
# browser.startup.page stays at Firefox's 1 (homepage), so a launch is a
# fresh window, not yesterday's tabs; History ▸ Restore Previous Session
# restores on request, and 3 would restore automatically.
- name: browser.startup.homepage
  value: about:newtab

# No yellow flash when the findbar opens (findbar.js _flash); the focused
# field is the cue.
- name: accessibility.typeaheadfind.flashBar
  value: 0

# Off until the tab strip has a design for group labels. Covers the tab
# context menu items, drag-to-group, the address bar's group actions and the
# Settings checkbox. Smart groups (browser.tabs.groups.smart.optin) are
# already off by default.
- name: browser.tabs.groups.enabled
  value: false

# The two-row layout assumes horizontal tabs. Locked, as in Zen; Settings
# leaves out its control (preferences-js.patch) and koi-chrome.css hides the
# context-menu toggle.
- name: sidebar.verticalTabs
  value: false
  locked: true

# On by default since 157, but the page card, empty state and board each
# assume one page. Off and locked, as in Zen, until designed.
- name: browser.tabs.splitView.enabled
  value: false
  locked: true

# 157's trust panel replaces the identity box koi-chrome.css targets and adds
# a "Not Secure" label the pill's hide list misses. Off, as in Zen; re-review
# when Mozilla removes the identity box.
- name: browser.urlbar.trustPanel.featureGate
  value: false

# Firefox counts only visible tabs as "the last tab", so closing a space's
# last tab would take the window, hidden spaces and all, with it. Off, as in
# Zen, so Firefox leaves an empty tab instead; koi-spaces.js then goes to the
# window's remaining tabs, or closes the window when none holds anything.
- name: browser.tabs.closeWindowWithLastTab
  value: false

# Nothing pops up: no downloads panel opening on every download.
- name: browser.download.alwaysOpenPanel
  value: false

# Arrow panels become native NSPopovers, with macOS's blurred material,
# shadow and corners. Off upstream; Zen contributed it and ships it on.
# koi-panels.css clears Firefox's paint so the material shows; Zen's fixes
# for it are in the nsCocoaWindow and global-shared.css patches.
- name: widget.macos.native-popovers
  value: true

# Firefox's profile switcher (an app menu row, a menu-bar Profiles menu).
# Off, as in Zen.
- name: browser.profiles.enabled
  value: false
