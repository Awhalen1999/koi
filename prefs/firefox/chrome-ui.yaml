# The chrome and the empty state (src/koi/chrome/, src/koi/newtab/): the
# knobs Firefox only exposes as prefs.

# Two rows are the whole chrome; a bookmarks row would make it three.
- name: browser.toolbars.bookmarks.visibility
  value: never

# The spec's tab floor: tabs narrow together to 100px, then the strip scrolls
# sideways instead, so a tab is always readable and always present.
- name: browser.tabs.tabMinWidth
  value: 100

# The empty state (src/koi/newtab/) is chrome drawn over the wallpaper, so an
# empty tab must be an actually empty page. Startup lands on about:blank like
# every new tab (browser.newtabpage.enabled is already off in newtab.yaml).
#
# That is also the session-restore decision, made deliberately: Firefox's
# browser.startup.page stays at its default of 1 (open the homepage), so a
# launch is a fresh window on the wallpaper, never a pile of yesterday's
# tabs — nothing asks for attention. The session is still kept; History ▸
# Restore Previous Session brings it back on request. Set the pref to 3 to
# restore automatically.
- name: browser.startup.homepage
  value: about:blank

# Blank browsers paint nothing, letting the wallpaper through to the empty
# card. Ordinary pages are unaffected: they sit on .browserContainer's
# backdrop, which koi-shell.css still paints.
- name: browser.tabs.allow_transparent_browser
  value: true

# The findbar blinks its field yellow when it opens (findbar.js _flash).
# Nothing in Koi asks for attention; the field opening focused is the cue.
- name: accessibility.typeaheadfind.flashBar
  value: 0

# Tab groups are Firefox's, not yet Koi's: the strip has no design for a
# group label, so the whole surface — the tab context menu's group items,
# drag-to-group, the address bar's group actions, the Settings checkbox —
# stays off until it has one (koi-chrome.css says the same of containers).
# Smart groups sit behind browser.tabs.groups.smart.optin, false by default,
# so there is nothing there to switch off.
- name: browser.tabs.groups.enabled
  value: false
